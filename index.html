<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Ocean Tide</title>
<link rel="stylesheet" href="styles.css?v=11">
</head>
<body>
  <div id="frame" class="theme-day">
    <!-- ===== HEADER ===== -->
    <header id="head">
      <section id="head-left">
        <div id="loc"><h1 id="station">—</h1><span id="clock">—</span></div>
        <div id="conditions">
          <span class="cond"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 14.5V5a2 2 0 1 0-4 0v9.5a4 4 0 1 0 4 0z"/></svg><b id="airtemp">--</b></span>
          <span class="cond"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9h12a3 3 0 1 0-3-3M3 15h16a3 3 0 1 1-3 3"/></svg><b id="wind">--</b></span>
          <span class="cond"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3c3 5 6 8 6 12a6 6 0 0 1-12 0c0-4 3-7 6-12z"/></svg><b id="humidity">--</b></span>
          <span class="cond"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 12l4-2"/><circle cx="12" cy="12" r="1.3" fill="currentColor"/></svg><b id="pressure">--</b></span>
          <span class="cond"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 8c2-2 4-2 6 0s4 2 6 0 4-2 6 0M2 14c2-2 4-2 6 0s4 2 6 0 4-2 6 0M2 20c2-2 4-2 6 0s4 2 6 0 4-2 6 0"/></svg><b id="water">--</b></span>
        </div>
        <p id="asof">as of --:--</p>
        <div id="current">
          <span id="cur-dir" class="tri">▼</span><span id="cur-height">--</span><span id="cur-unit"> ft</span> <span id="cur-state">and —</span>
        </div>
        <p id="vs-pred">&nbsp;</p>
      </section>
      <section id="head-right">
        <div id="dateline"><span id="date">—</span><span id="status" aria-hidden="true"></span></div>
        <ul id="events"></ul>
      </section>
    </header>

    <!-- ===== TIDE GRAPH (48h window: 12h past + 36h future, scroll forward for more) ===== -->
    <main id="graph-wrap">
      <svg id="yaxis" preserveAspectRatio="none" aria-hidden="true"></svg>
      <div id="graph-scroll"><svg id="graph" preserveAspectRatio="none" aria-label="48 hour tide curve, scroll for more"></svg></div>
    </main>

    <!-- ===== FOOTER ===== -->
    <footer id="foot">
      <span class="fitem"><svg class="ic sun" viewBox="0 0 24 24"><circle cx="12" cy="13" r="4"/><path d="M12 3v3M5 13H2M22 13h-3M6 7 4 5M18 7l2-2"/><path class="arr" d="M9 15l3-4 3 4"/></svg><span class="flabel">Sunrise</span><span id="sunrise">--</span></span>
      <span class="fitem"><svg class="ic sun" viewBox="0 0 24 24"><circle cx="12" cy="13" r="4"/><path d="M12 3v3M5 13H2M22 13h-3M6 7 4 5M18 7l2-2"/><path class="arr" d="M9 13l3 4 3-4"/></svg><span class="flabel">Sunset</span><span id="sunset">--</span></span>
      <span class="fitem"><span id="moon-ic" class="moon"></span><span id="moon-name">—</span></span>
      <span class="fitem"><span id="moon-next">Next --</span></span>
      <span id="ver">v11 &middot; 2026-11-10 10:31</span>
    </footer>
  </div>
  <script src="config.js?v=11"></script>
  <script src="suncalc.js?v=11"></script>
  <script src="data.js?v=11"></script>
  <script src="app.js?v=11"></script>
</body>
</html>
