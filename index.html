<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Ocean Tide</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="frame" class="theme-day">
    <!-- ===== HEADER ===== -->
    <header id="head">
      <!-- left: station + conditions + current state -->
      <section id="head-left">
        <h1 id="station">—</h1>
        <div id="conditions">
          <span class="cond"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 8c2-2 4-2 6 0s4 2 6 0 4-2 6 0M2 14c2-2 4-2 6 0s4 2 6 0 4-2 6 0M2 20c2-2 4-2 6 0s4 2 6 0 4-2 6 0"/></svg><b id="water">--</b></span>
          <span class="cond"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9h12a3 3 0 1 0-3-3M3 15h16a3 3 0 1 1-3 3"/></svg><b id="wind">--</b></span>
          <span class="cond"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 12l4-2"/><circle cx="12" cy="12" r="1.3" fill="currentColor"/></svg><b id="pressure">--</b></span>
        </div>
        <p id="asof">as of --:--</p>
        <div id="current">
          <span id="cur-dir" class="tri">▼</span><span id="cur-height">--</span><span id="cur-unit"> ft</span> <span id="cur-state">and —</span>
        </div>
        <p id="vs-pred">&nbsp;</p>
      </section>
      <!-- right: date + upcoming hi/lo -->
      <section id="head-right">
        <div id="dateline"><span id="date">—</span><span id="status" aria-hidden="true"></span></div>
        <ul id="events"></ul>
      </section>
    </header>

    <!-- ===== TIDE GRAPH ===== -->
    <main id="graph-wrap">
      <svg id="graph" viewBox="0 0 1200 360" preserveAspectRatio="none" aria-label="24 hour tide curve"></svg>
    </main>

    <!-- ===== FOOTER ===== -->
    <footer id="foot">
      <span class="fitem"><svg class="ic sun" viewBox="0 0 24 24"><circle cx="12" cy="13" r="4"/><path d="M12 3v3M5 13H2M22 13h-3M6 7 4 5M18 7l2-2"/><path class="arr" d="M9 13l3 4 3-4"/></svg><span id="sunrise">--</span></span>
      <span class="fitem"><svg class="ic sun" viewBox="0 0 24 24"><circle cx="12" cy="13" r="4"/><path d="M12 3v3M5 13H2M22 13h-3M6 7 4 5M18 7l2-2"/><path class="arr" d="M9 17l3-4 3 4"/></svg><span id="sunset">--</span></span>
      <span class="fitem"><span id="moon-ic" class="moon"></span><span id="moon-name">—</span></span>
      <span class="fitem"><span id="moon-next">Next --</span></span>
    </footer>
  </div>
  <script src="config.js"></script>
  <script src="suncalc.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
